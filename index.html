<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IMS Q-Bank | Internal Medicine Simplified</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      padding-bottom: 80px;
    }
    @media print { body { display: none !important; } }
    .header {
      background: #1e293b;
      color: #fff;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .header span { font-weight: 800; letter-spacing: 0.5px; font-size: 16px; justify-self: start; }
    select {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      justify-self: center;
    }
    @media (max-width: 480px) {
      .header { display: flex; justify-content: flex-start; gap: 12px; padding-right: 95px; }
    }
    .container { max-width: 780px; margin: 18px auto; padding: 0 14px; position: relative; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }
    .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13.5px; }
    .sys-tag { color: var(--accent); font-weight: 700; }
    .q-code { color: var(--muted); font-family: monospace; font-size: 12.5px; }
    .stem { font-size: 16px; line-height: 1.7; color: #1e293b; margin-bottom: 20px; white-space: pre-line; position: relative; z-index: 2; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 11px;
      cursor: pointer;
      transition: 0.15s;
      background: rgba(255,255,255,0.92);
      position: relative;
      z-index: 2;
    }
    .option:hover { border-color: #93c5fd; background: #f8fafc; }
    .option.correct { background: var(--correct-bg); border-color: var(--correct-border); }
    .option.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
    .opt-letter { font-weight: 700; color: #334155; min-width: 24px; }
    .opt-text { font-size: 15px; line-height: 1.5; color: #0f172a; }
    .explanation {
      margin-top: 18px;
      padding: 15px;
      background: #f1f5f9;
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.65;
      color: #1e293b;
      white-space: pre-line;
      display: none;
      position: relative;
      z-index: 2;
    }
    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }
    .nav-btn {
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .watermark-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      place-items: center;
      opacity: 0.13;
      overflow: hidden;
    }
    .wm-text { transform: rotate(-26deg); font-size: 16px; font-weight: 800; color: #0f172a; white-space: nowrap; }
  </style>
</head>
<body>

  <div class="header">
    <span>IMS Q-BANK</span>
    <select id="systemSelect" onchange="changeSystem(this.value)"></select>
  </div>

  <div id="app"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (typeof tg.requestFullscreen === "function") {
        try { tg.requestFullscreen(); } catch (e) {}
      }
    }

    const ALLOWED_USERS = [
      8799345580,
      798256935
    ];

    const user = tg?.initDataUnsafe?.user || { id: 8799345580, first_name: "Dr. Ghassan", username: "admin" };
    const watermarkText = `IMS | ${user.first_name} (${user.id})`;

    if (!ALLOWED_USERS.includes(user.id)) {
      document.body.innerHTML = `
        <div class="header"><span>IMS Q-BANK</span></div>
        <div class="container">
          <div class="card" style="text-align:center; padding: 32px 20px;">
            <h3 style="margin-top:0; color:#1e293b;">🔒 بنك الأسئلة مخصص لمشتركي<br>IMS Clinical Hub</h3>
            <p style="color:#475569; font-size:15px; line-height:1.6;">
              للاشتراك وتفعيل حسابك، انسخ رقم المعرّف الخاص بك أدناه وأرسله إلى <strong>@IMSsimp</strong>:
            </p>
            <div style="background:#f1f5f9; border:1.5px dashed #94a3b8; padding:12px; border-radius:8px; font-family:monospace; font-size:19px; font-weight:bold; color:#0f172a; margin:16px 0 12px; user-select:all; -webkit-user-select:all;">
              ${user.id}
            </div>
            <button id="copyIdBtn" onclick="copyUserId('${user.id}')" style="background:#2563eb; color:#ffffff; border:none; padding:12px 22px; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; width:100%;">
              📋 نسخ رقم المعرّف
            </button>
          </div>
        </div>
      `;
      window.copyUserId = function(idText) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(idText).catch(() => fallbackCopy(idText));
        } else {
          fallbackCopy(idText);
        }
        const btn = document.getElementById('copyIdBtn');
        btn.style.background = '#16a34a';
        btn.innerText = '✅ تم النسخ! أرسله الآن إلى @IMSsimp';
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      };
      window.fallbackCopy = function(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      };
      throw new Error("Unauthorized user");
    }

    // فك تشفير خزنة الأسئلة في الذاكرة للمشتركين المصرح لهم فقط
    function unlockVault() {
      if (typeof IMS_VAULT !== "undefined" && IMS_VAULT) {
        try {
          const reversed = IMS_VAULT.split("").reverse().join("");
          const binary = atob(reversed);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const jsonStr = new TextDecoder("utf-8").decode(bytes);
          return JSON.parse(jsonStr);
        } catch (e) {
          console.error("Vault unlock error:", e);
          return [];
        }
      }
      if (typeof QUESTIONS !== "undefined" && Array.isArray(QUESTIONS)) return QUESTIONS;
      return [];
    }

    const wmLayer = document.createElement("div");
    wmLayer.className = "watermark-layer";
    wmLayer.innerHTML = Array(8).fill(`<div class="wm-text">${watermarkText}</div>`).join("");
    document.body.appendChild(wmLayer);

    document.addEventListener("contextmenu", e => e.preventDefault());

    let Q_LIST = [];
    let selectedSystem = "ALL";
    let currentIdx = 0;
    let answers = JSON.parse(localStorage.getItem("ims_answers") || "{}");

    function startApp() {
      Q_LIST = unlockVault();
      if (!Q_LIST.length) {
        document.getElementById("app").innerHTML = `<div class="container"><div class="card">No questions loaded yet.</div></div>`;
        return;
      }
      initSystems();
      render();
    }

    function initSystems() {
      const select = document.getElementById("systemSelect");
      const systems = [...new Set(Q_LIST.map(q => q.system))];
      let html = `<option value="ALL">All Systems (${Q_LIST.length})</option>`;
      systems.forEach(sys => {
        const count = Q_LIST.filter(q => q.system === sys).length;
        html += `<option value="${sys}">${sys} (${count})</option>`;
      });
      select.innerHTML = html;
    }

    function getFilteredQuestions() {
      return selectedSystem === "ALL" ? Q_LIST : Q_LIST.filter(q => q.system === selectedSystem);
    }

    function changeSystem(val) { selectedSystem = val; currentIdx = 0; render(); }

    function selectOption(qId, optIdx) {
      if (answers[qId] !== undefined) return;
      answers[qId] = optIdx;
      localStorage.setItem("ims_answers", JSON.stringify(answers));
      render();
    }

    function render() {
      const list = getFilteredQuestions();
      const app = document.getElementById("app");
      if (!list.length) {
        app.innerHTML = `<div class="container"><div class="card">No questions available in this system yet.</div></div>`;
        return;
      }
      const q = list[currentIdx];
      const userAns = answers[q.id];
      const letters = ["A", "B", "C", "D", "E"];

      let optionsHtml = q.options.map((opt, idx) => {
        let cls = "option";
        if (userAns !== undefined) {
          if (idx === q.answer) cls += " correct";
          else if (idx === userAns) cls += " wrong";
        }
        return `
          <div class="${cls}" onclick="selectOption(${q.id}, ${idx})">
            <span class="opt-letter">${letters[idx]}.</span>
            <span class="opt-text">${opt}</span>
          </div>
        `;
      }).join("");

      app.innerHTML = `
        <div class="container">
          <div class="card">
            <div class="meta-bar">
              <span class="sys-tag">${q.system} • Q ${currentIdx + 1} / ${list.length}</span>
              <span class="q-code">${q.code}</span>
            </div>
            <div class="stem">${q.stem}</div>
            ${optionsHtml}
            <div class="explanation" style="display: ${userAns !== undefined ? 'block' : 'none'}">
              <strong>Explanation:</strong><br>${q.explanation}
            </div>
          </div>
        </div>
        <div class="nav-bar">
          <button class="nav-btn" onclick="prevQ()" ${currentIdx === 0 ? 'disabled' : ''}>← Previous</button>
          <span style="font-size:13px; color:#64748b; font-weight:600;">${Object.keys(answers).length} Solved</span>
          <button class="nav-btn" onclick="nextQ()" ${currentIdx === list.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      `;
    }

    function prevQ() { if (currentIdx > 0) { currentIdx--; render(); } }
    function nextQ() { const list = getFilteredQuestions(); if (currentIdx < list.length - 1) { currentIdx++; render(); } }
  </script>
  <script>
    const qScript = document.createElement("script");
    qScript.src = "questions.js?v=" + Date.now();
    qScript.onload = startApp;
    document.body.appendChild(qScript);
  </script>
</body>
</html>
