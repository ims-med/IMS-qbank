<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IMS Q-Bank | Internal Medicine Simplified</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #1b6ca8;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --amber: #d97706;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); user-select: none; -webkit-user-select: none; }
    
    .topbar {
      background: #2c3e50; color: #fff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 20;
    }
    .topbar h1 { margin: 0; font-size: 16px; letter-spacing: 0.5px; }
    .badge { background: var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }

    .container { max-width: 1100px; margin: 14px auto; padding: 0 12px; display: grid; grid-template-columns: 1fr 310px; gap: 14px; }
    @media (max-width: 820px) { .container { grid-template-columns: 1fr; } }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; position: relative; overflow: hidden; }
    
    .q-meta { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 14px; }
    .q-cat { font-weight: 700; color: var(--primary); font-size: 15px; }
    .q-actions { display: flex; gap: 10px; align-items: center; }
    .flag-btn {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 5px;
      padding: 4px 10px; cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600;
    }
    .flag-btn.flagged { background: #fef3c7; border-color: var(--amber); color: var(--amber); }

    .watermark {
      position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg);
      font-size: 18px; font-weight: 700; color: rgba(100, 116, 139, 0.14);
      pointer-events: none; text-align: center; white-space: nowrap; z-index: 5;
    }

    .q-stem { font-size: 15.5px; line-height: 1.65; margin-bottom: 18px; position: relative; z-index: 6; }
    .options { display: flex; flex-direction: column; gap: 9px; position: relative; z-index: 6; }
    .option {
      border: 1px solid var(--border); border-radius: 6px; padding: 11px 14px;
      background: #f8fafc; cursor: pointer; display: flex; align-items: center; gap: 10px;
      font-size: 14.5px; transition: 0.15s;
    }
    .option:hover:not(.disabled) { background: #eff6ff; border-color: var(--primary); }
    .option.correct { background: var(--green-bg); border-color: var(--green); color: #14532d; font-weight: 600; }
    .option.wrong { background: var(--red-bg); border-color: var(--red); color: #7f1d1d; }
    .option.disabled { cursor: default; }

    .explanation {
      margin-top: 16px; padding: 14px; background: #f0f9ff; border-left: 4px solid var(--primary);
      border-radius: 6px; font-size: 14px; line-height: 1.6; display: none; position: relative; z-index: 6;
    }
    .explanation h4 { margin: 0 0 6px 0; color: var(--primary); font-size: 14.5px; }

    .nav-row { display: flex; justify-content: space-between; margin-top: 16px; }
    .btn {
      background: var(--primary); color: #fff; border: none; padding: 9px 16px;
      border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn.secondary { background: #e2e8f0; color: var(--text); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .filter-tabs { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .tab { padding: 7px; text-align: center; font-size: 12.5px; font-weight: 600; background: #f8fafc; cursor: pointer; border: none; }
    .tab.active { background: var(--primary); color: #fff; }
    
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-height: 360px; overflow-y: auto; }
    .q-num {
      aspect-ratio: 1; border: 1px solid var(--border); border-radius: 4px;
      display: flex; align-items: center; justify-content: center; font-size: 12.5px;
      font-weight: 600; cursor: pointer; background: #fff; position: relative;
    }
    .q-num.current { border: 2px solid #0f172a; }
    .q-num.correct { background: var(--green); color: #fff; border-color: var(--green); }
    .q-num.wrong { background: var(--red); color: #fff; border-color: var(--red); }
    .q-num.flagged::after {
      content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px;
      background: var(--amber); border-radius: 50%;
    }

    .stats { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
    .denied { text-align: center; padding: 50px 20px; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>IMS CLINICAL Q-BANK</h1>
  <span class="badge" id="systemBadge">Respiratory</span>
</div>

<div id="app"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const ALLOWED_USERS = []; 

  const user = tg?.initDataUnsafe?.user || { id: "PREVIEW-001", first_name: "IMS Student", username: "guest" };
  const watermarkText = `IMS | ${user.first_name} (${user.id})`;

  const QUESTIONS = [
    {
      id: 1,
      system: "Respiratory",
      code: "IMS-RM-01",
      stem: "A 28-year-old male is admitted with an acute severe exacerbation of asthma. He is initially treated with 100% oxygen, salbutamol nebulizers, and hydrocortisone 100 mg IV. Despite treatment, his oxygen saturation is 89% and respiratory rate is 30 breaths/minute. What is the SINGLE most appropriate next step in management?",
      options: [
        "Prednisolone 40 mg orally",
        "Add ipratropium bromide 0.5 mg to nebulizers",
        "Intravenous salbutamol",
        "Intramuscular adrenaline",
        "Stop administration of oxygen"
      ],
      answer: 1,
      explanation: "In acute severe or life-threatening asthma not responding adequately to initial beta-2 agonist (salbutamol) and systemic steroids, the immediate next step according to NICE/BTS guidelines is adding nebulized ipratropium bromide (0.5 mg) every 4–6 hours. IV magnesium sulfate is considered if there is still poor response."
    },
    {
      id: 2,
      system: "Respiratory",
      code: "IMS-RM-02",
      stem: "A 66-year-old smoker presents with progressive dyspnea, dry cough, and clubbing of the fingers. Auscultation reveals fine bibasilar end-inspiratory crackles ('Velcro' crackles). High-resolution CT chest shows subpleural basal reticulation and honeycombing. Which medication slows disease progression in this condition?",
      options: [
        "Inhaled fluticasone",
        "Pirfenidone",
        "Long-term azithromycin",
        "Oral prednisolone monotherapy",
        "Methotrexate"
      ],
      answer: 1,
      explanation: "The clinical picture and HRCT honeycombing are classic for Idiopathic Pulmonary Fibrosis (IPF). Antifibrotic agents (Pirfenidone or Nintedanib) are the mainstay of therapy to slow FVC decline. Immunosuppressants/steroids are harmful in chronic IPF."
    },
    {
      id: 3,
      system: "Cardiology",
      code: "IMS-CV-01",
      stem: "A 58-year-old man develops sudden central crushing chest pain radiating to his left jaw. ECG shows 3 mm ST-segment elevation in leads II, III, and aVF. His blood pressure is 82/50 mmHg, heart rate is 54 bpm, and JVP is elevated with clear lung fields. Which drug must be AVOIDED in his acute management?",
      options: [
        "Aspirin 300 mg",
        "Glyceryl trinitrate (GTN)",
        "Ticagrelor 180 mg",
        "Intravenous normal saline bolus",
        "Unfractionated heparin"
      ],
      answer: 1,
      explanation: "Inferior STEMI (II, III, aVF) complicated by hypotension, elevated JVP, and clear lungs indicates Right Ventricular Infarction. Right ventricular preload is critical; nitrates (GTN) cause venodilation, severely dropping preload and causing profound circulatory collapse."
    }
  ];

  let currentIdx = 0;
  let filter = "all";
  let answers = JSON.parse(localStorage.getItem("ims_answers") || "{}");
  let flags = JSON.parse(localStorage.getItem("ims_flags") || "{}");

  function saveState() {
    localStorage.setItem("ims_answers", JSON.stringify(answers));
    localStorage.setItem("ims_flags", JSON.stringify(flags));
  }

  function render() {
    const app = document.getElementById("app");
    if (ALLOWED_USERS.length > 0 && !ALLOWED_USERS.includes(user.id)) {
      app.innerHTML = `<div class="card denied" style="margin:20px;">
        <h3>عذراً، هذا البنك متاح لمشتركي IMS Clinical Hub فقط</h3>
        <p>معرّف حسابك: <b>${user.id}</b></p>
        <p>للاشتراك وتفعيل حسابك تواصل مع: <b>@IMSsimp</b></p>
      </div>`;
      return;
    }

    const q = QUESTIONS[currentIdx];
    document.getElementById("systemBadge").textContent = q.system;
    const userAns = answers[q.id];
    const isAnswered = userAns !== undefined;
    const isFlagged = !!flags[q.id];

    const filteredQuestions = QUESTIONS.filter(item => {
      if (filter === "flagged") return !!flags[item.id];
      if (filter === "wrong") return answers[item.id] !== undefined && answers[item.id] !== item.answer;
      return true;
    });

    const correctCount = QUESTIONS.filter(item => answers[item.id] === item.answer).length;
    const wrongCount = QUESTIONS.filter(item => answers[item.id] !== undefined && answers[item.id] !== item.answer).length;

    app.innerHTML = `
      <div class="container">
        <div class="card">
          <div class="watermark">${watermarkText}</div>
          <div class="q-meta">
            <span class="q-cat">${q.system} • Question ${currentIdx + 1} of ${QUESTIONS.length}</span>
            <div class="q-actions">
              <span style="font-size:12px;color:var(--muted);">${q.code}</span>
              <button class="flag-btn ${isFlagged ? 'flagged' : ''}" onclick="toggleFlag(${q.id})">
                ${isFlagged ? '🚩 Flagged' : '🏳️ Flag'}
              </button>
            </div>
          </div>

          <div class="q-stem">${q.stem}</div>

          <div class="options">
            ${q.options.map((opt, idx) => {
              let cls = "option";
              if (isAnswered) {
                cls += " disabled";
                if (idx === q.answer) cls += " correct";
                else if (idx === userAns) cls += " wrong";
              }
              const letter = String.fromCharCode(65 + idx);
              return `<div class="${cls}" onclick="selectOption(${q.id}, ${idx})">
                <b>${letter}.</b> <span>${opt}</span>
              </div>`;
            }).join("")}
          </div>

          <div class="explanation" style="display:${isAnswered ? 'block' : 'none'}">
            <h4>Explanation</h4>
            <div>${q.explanation}</div>
          </div>

          <div class="nav-row">
            <button class="btn secondary" onclick="prevQ()" ${currentIdx === 0 ? 'disabled' : ''}>← Previous</button>
            <button class="btn" onclick="nextQ()" ${currentIdx === QUESTIONS.length - 1 ? 'disabled' : ''}>Next →</button>
          </div>
        </div>

        <div class="card">
          <div class="filter-tabs">
            <button class="tab ${filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All (${QUESTIONS.length})</button>
            <button class="tab ${filter === 'flagged' ? 'active' : ''}" onclick="setFilter('flagged')">Flagged</button>
            <button class="tab ${filter === 'wrong' ? 'active' : ''}" onclick="setFilter('wrong')">Incorrect</button>
          </div>

          <div class="grid">
            ${filteredQuestions.map(item => {
              const realIdx = QUESTIONS.findIndex(x => x.id === item.id);
              let cls = "q-num";
              if (realIdx === currentIdx) cls += " current";
              if (answers[item.id] !== undefined) {
                cls += (answers[item.id] === item.answer) ? " correct" : " wrong";
              }
              if (flags[item.id]) cls += " flagged";
              return `<div class="${cls}" onclick="jumpTo(${realIdx})">${realIdx + 1}</div>`;
            }).join("")}
          </div>

          <div class="stats">
            <span style="color:var(--green);font-weight:600;">✓ Correct: ${correctCount}</span>
            <span style="color:var(--red);font-weight:600;">✕ Wrong: ${wrongCount}</span>
            <span style="cursor:pointer;text-decoration:underline;" onclick="resetProgress()">Reset</span>
          </div>
        </div>
      </div>
    `;
  }

  function selectOption(qId, idx) {
    if (answers[qId] !== undefined) return;
    answers[qId] = idx;
    saveState();
    render();
  }
  function toggleFlag(qId) { flags[qId] = !flags[qId]; saveState(); render(); }
  function setFilter(f) { filter = f; render(); }
  function jumpTo(idx) { currentIdx = idx; render(); }
  function prevQ() { if (currentIdx > 0) { currentIdx--; render(); } }
  function nextQ() { if (currentIdx < QUESTIONS.length - 1) { currentIdx++; render(); } }
  function resetProgress() {
    if (confirm("هل تريد تصفير جميع إجاباتك والبدء من جديد؟")) {
      answers = {}; flags = {}; saveState(); currentIdx = 0; render();
    }
  }

  render();
</script>
</body>
</html>
